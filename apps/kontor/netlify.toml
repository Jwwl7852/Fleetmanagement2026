# Kontorappen — flådestyring hos kunden
# Sæt "Base directory" til apps/kontor i Netlify, så bliver denne fil læst.

[build]
  publish = "."
  command = "node ../../scripts/synk-config.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Alt peger på index.html, så dybe links ikke giver 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
